<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pandit Ji</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #fff;
    }
    /* Circle-crops the logo so its grey corners disappear against the black page */
    .logo {
      width: 160px; height: 160px; border-radius: 50%;
      background: #000 url("logo.png") no-repeat;
      background-size: 108% auto;
      background-position: 50% 6%;
    }
    .brand { font-size: 28px; font-weight: 700; letter-spacing: 1px; margin-top: -16px; }
    .cta {
      display: inline-block;
      padding: 16px 36px;
      border-radius: 999px;
      background: #ffb366;
      color: #2a1450;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(255, 179, 102, .35);
      transition: transform .15s ease;
    }
    .cta:hover { transform: translateY(-2px); }
    .admin-link { position: fixed; bottom: 16px; right: 20px; font-size: 13px; color: rgba(255,255,255,.5); text-decoration: none; }
    .admin-link:hover { color: #fff; }
    .wrap { display: flex; flex-direction: column; align-items: center; gap: 32px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo" role="img" aria-label="Pandit Ji logo"></div>
    <div class="brand">Pandit Ji</div>
    <a id="cta" class="cta" href="#">Talk to Astrologer Surendra</a>
  </div>
  <a class="admin-link" href="admin.html">Admin</a>

  <script>
    var DEFAULTS = { text: "Talk to Astrologer Surendra", url: "#" };
    var cfg = DEFAULTS;
    try { cfg = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem("ctaConfig") || "{}")); } catch (e) {}
    var el = document.getElementById("cta");
    el.textContent = cfg.text;
    el.href = cfg.url;
  </script>
</body>
</html>
