<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #fff;
    }
    .card { width: 100%; max-width: 460px; background: #111; border: 1px solid #2a2a2a; padding: 32px; border-radius: 16px; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    p.sub { color: #9a9a9a; font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px; margin-bottom: 18px;
      border: 1px solid #333; border-radius: 8px; font-size: 15px;
      background: #000; color: #fff;
    }
    input:focus { outline: 2px solid #ff6a00; border-color: transparent; }
    .preview { text-align: center; margin: 4px 0 22px; }
    .preview span { display: inline-block; padding: 12px 28px; border-radius: 999px; background: #ffb366; color: #2a1450; font-weight: 700; }
    .preview small { display: block; color: #9a9a9a; font-size: 12px; margin-bottom: 8px; }
    button {
      width: 100%; padding: 13px; border: 0; border-radius: 8px;
      background: #ff6a00; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #e55f00; }
    .msg { margin-top: 12px; font-size: 14px; text-align: center; min-height: 20px; }
    .ok { color: #4cd964; } .err { color: #ff6b6b; }
    .links { display: flex; justify-content: space-between; margin-top: 20px; font-size: 14px; }
    .links a { color: #ff9a4d; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Admin Panel</h1>
    <p class="sub">Edit the call-to-action button on the landing page.</p>

    <label for="text">Button text</label>
    <input id="text" type="text" placeholder="Talk to Astrologer Surendra">

    <label for="url">Button link (URL)</label>
    <input id="url" type="text" placeholder="https://example.com/chat">

    <div class="preview">
      <small>Preview</small>
      <span id="preview"></span>
    </div>

    <button id="save">Save changes</button>
    <div id="msg" class="msg"></div>

    <div class="links">
      <a href="index.html">&larr; View landing page</a>
      <a href="#" id="reset">Reset to default</a>
    </div>
  </div>

  <script>
    var DEFAULTS = { text: "Talk to Astrologer Surendra", url: "#" };
    var $ = function (id) { return document.getElementById(id); };

    function load() {
      try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem("ctaConfig") || "{}")); }
      catch (e) { return DEFAULTS; }
    }
    function fill(cfg) {
      $("text").value = cfg.text;
      $("url").value = cfg.url;
      $("preview").textContent = cfg.text;
    }
    function say(text, cls) { $("msg").textContent = text; $("msg").className = "msg " + cls; }

    fill(load());
    $("text").addEventListener("input", function () { $("preview").textContent = $("text").value || "…"; });

    $("save").addEventListener("click", function () {
      var text = $("text").value.trim();
      var url = $("url").value.trim();
      if (!text) return say("Button text can't be empty.", "err");
      if (!url) url = "#";
      if (url !== "#" && !/^(https?:|mailto:|tel:|\/|\.)/i.test(url)) url = "https://" + url;
      try {
        localStorage.setItem("ctaConfig", JSON.stringify({ text: text, url: url }));
        $("url").value = url;
        say("Saved! Refresh the landing page to see it.", "ok");
      } catch (e) { say("Couldn't save (browser storage blocked).", "err"); }
    });

    $("reset").addEventListener("click", function (e) {
      e.preventDefault();
      try { localStorage.removeItem("ctaConfig"); } catch (err) {}
      fill(DEFAULTS);
      say("Reset to default.", "ok");
    });
  </script>
</body>
</html>
